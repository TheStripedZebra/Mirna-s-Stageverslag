        .blueprint-wrapper {

        .hotspot, .legend-item {
            position: absolute; width: 1.6%; aspect-ratio: 1 / 1; border-radius: 50%;

        .hotspot:hover, .legend-item:hover {

<body>

    <div id="photo-zoom-preview">
        <img src="" alt="Zoom">
        <span></span>
    </div>

    <div class="blueprint-wrapper">
        <div class="blueprint-container">
            <img src="BLUEPRINT BASE.png" alt="Blueprint Base">
            
            <script>
                const modalTitles = [
                    "King Cobra", "Zendercontainer", "Kleedkamer", "House of Horror", "Cycloon",
                    "Toren", "Reuzenrad", "Suikerspinkraam", "Carrousel", "Kassa",
                    "Droomtunnel", "Schiettent", "Tribune", "Regie", "Boktor",
                    "Dance Jumper", "Octopus", "'t Anker", "De Voortuin", "Binnentuin",
                    "Kantoor", "De Rode Haring", "Het Zeepaard", "Stretchtent", "Parkeerplaats", "Kopstoot Bar"
                ];

                const container = document.currentScript.parentNode;
                for(let i=1; i<=26; i++) {
                    container.innerHTML += `<div class="hotspot spot-${i}"></div><div class="legend-item leg-${i}"></div>`;
                }

                modalTitles.forEach((title, index) => {
                    const id = index + 1;
                    const isRight = [17, 18, 19, 20, 21, 22, 25].includes(id) ? "" : "-right";
                    const closeClass = [11, 12, 14, 15, 17, 20, 21, 22, 23, 24, 26].includes(id) ? "close-tr" : "close-tl";

                    const html = `
                    <div id="modal-${id}" class="modal-overlay">
                        <div class="modal-card">
                            <button class="modal-close ${closeClass}"><span>X</span></button>
                            <div class="modal-title">${id}. ${title}</div>
                            <div class="modal-body">
                                <p class="stage-text" data-field="stage-${id}">Korte samenvatting van onderdeel ${id}.</p>
                                <span class="blueprint-hover-trigger" onclick="toggleDetailClick(this)">Lees meer...</span>
                                <div class="photo-gallery-header">
                                    <span class="photo-gallery-title">Foto's</span>
                                </div>
                                <div class="photo-gallery" id="gallery-${id}"></div>
                            </div>
                            <div class="detail-card${isRight}">
                                <div class="detail-header"><span class="detail-tag">Uitgebreid verslag</span></div>
                                <div class="detail-body">
                                    <p class="detail-text" data-field="detail-${id}">Uitgebreid verslag voor ${title}...</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });
            </script>
        </div>
    </div>

    <script>
        // --- INLADEN VAN DATA UIT DATA.JS VOOR DE LEZER ---
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof externalProjectData !== 'undefined') {
                // Vul alle teksten in
                document.querySelectorAll('[data-field]').forEach(el => {
                    const key = el.getAttribute('data-field');
                    if (externalProjectData[key] !== undefined) {
                        el.innerHTML = externalProjectData[key];
                    }
                });

                // Vul alle fotogalerijen in (zonder bewerk-opties)
                for (let i = 1; i <= 26; i++) {
                    const galKey = 'gallery-' + i;
                    if (externalProjectData[galKey]) {
                        const el = document.getElementById(galKey);
                        if (el) {
                            el.innerHTML = externalProjectData[galKey];
                        }
                    }
                }
            }
        });

        function toggleDetailClick(trig) {
            const card = trig.closest('.modal-card').querySelector('.detail-card, .detail-card-right');
            if (card) {
                card.classList.toggle('active');
                trig.textContent = card.classList.contains('active') ? 'Lees minder...' : 'Lees meer...';
            }
        }

        // --- ZOOM PREVIEW VOOR FOTO'S ---
        const zoomPreview = document.getElementById('photo-zoom-preview');
        const zoomImg = zoomPreview.querySelector('img');
        const zoomSpan = zoomPreview.querySelector('span');

        document.addEventListener('mouseover', (e) => {
            const polaroid = e.target.closest('.polaroid');
            if (polaroid) {
                const img = polaroid.querySelector('img');
                const span = polaroid.querySelector('span');
                if (img) {
                    zoomImg.src = img.src;
                    zoomSpan.textContent = span ? span.textContent : '';
                    
                    if (polaroid.classList.contains('portrait')) {
                        zoomPreview.classList.remove('landscape');
                        zoomPreview.classList.add('portrait');
                    } else {
                        zoomPreview.classList.remove('portrait');
                        zoomPreview.classList.add('landscape');
                    }

                    const rect = polaroid.getBoundingClientRect();
                    zoomPreview.style.left = `${Math.round(rect.left + rect.width / 2)}px`;
                    zoomPreview.style.top = `${Math.round(rect.top + rect.height / 2)}px`;
                    zoomPreview.classList.add('active');
                }
            }
        });

        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.polaroid')) {
                zoomPreview.classList.remove('active');
            }
        });

        // --- OPENEN VAN POP-UPS ---
        document.addEventListener('click', (e) => {
            const trig = e.target.closest('.hotspot, .legend-item');
            if (trig) {
                const cls = Array.from(trig.classList).find(c => c.startsWith('spot-') || c.startsWith('leg-'));
                if (cls) document.getElementById(`modal-${cls.split('-')[1]}`).classList.add('active');
            }
        });

        // --- SLUITEN VAN POP-UPS ---
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            const closeBtn = modal.querySelector('.modal-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    modal.classList.remove('active');
                    modal.querySelectorAll('.detail-card, .detail-card-right').forEach(card => card.classList.remove('active'));
                    modal.querySelectorAll('.blueprint-hover-trigger').forEach(trig => trig.textContent = 'Lees meer...');
                });
            }
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    modal.querySelectorAll('.detail-card, .detail-card-right').forEach(card => card.classList.remove('active'));
                    modal.querySelectorAll('.blueprint-hover-trigger').forEach(trig => trig.textContent = 'Lees meer...');
                }
            });
        });
    </script>
